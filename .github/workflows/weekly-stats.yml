name: Weekly Stats

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate Weekly Stats
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/generate-weekly-stats.js

      - name: Commit SVG
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add output/weekly-stats.svg

          git diff --staged --quiet || git commit -m "update weekly stats"

          git push